<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Physics AI Exam</title>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0b1220;
    color:white;
}

.container{
    max-width:900px;
    margin:auto;
    padding:20px;
}

.card{
    background:#1e293b;
    padding:20px;
    margin-top:15px;
    border-radius:10px;
}

button{
    background:#3b82f6;
    border:none;
    padding:10px;
    color:white;
    cursor:pointer;
    margin-top:10px;
}

textarea{
    width:100%;
    height:120px;
    margin-top:10px;
    background:#0b1220;
    color:white;
    border:none;
    padding:10px;
}
</style>
</head>

<body>

<div class="container">

<h1>AI Physics Exam Simulator</h1>

<div class="card" id="exam">
    <h2 id="q"></h2>

    <textarea id="a"></textarea>

    <button onclick="submit()">Submit</button>

    <div id="feedback"></div>
</div>

</div>

<script>

let questions = [
    {q:"Define electric field strength.", marks:2},
    {q:"State Newton's second law.", marks:2},
    {q:"Define momentum.", marks:2}
];

let i = 0;

document.getElementById("q").innerText = questions[i].q;

async function submit(){

    const answer = document.getElementById("a").value;

    const res = await fetch("/mark", {
        method:"POST",
        headers:{ "Content-Type":"application/json" },
        body: JSON.stringify({
            question: questions[i].q,
            answer,
            marks: questions[i].marks
        })
    });

    const data = await res.json();

    document.getElementById("feedback").innerHTML = `
        <p>Score: ${data.score}/${data.max}</p>
        <p>${data.feedback}</p>
        <p>Missing: ${data.missing_points?.join(", ")}</p>
    `;

    i++;

    if(i < questions.length){
        document.getElementById("q").innerText = questions[i].q;
        document.getElementById("a").value = "";
    } else {
        document.getElementById("q").innerText = "Exam complete";
    }
}

</script>

</body>
</html>
